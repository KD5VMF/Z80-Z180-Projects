# SC700/SC126 + RomWBW 8080 Assembly Profile (Extended)
# Version: 1.2
# Last-Updated: 2025-09-03
# Purpose: Generate *correct 8080 code* for SC700-series & SC126 (RomWBW CP/M 2.2)
# Style: ASM.COM 8080 mnemonics only; labels A–Z0–9 (avoid underscores)

meta:
  systems:
    - "SC700 family (RCBus; Z80-class; target 8080 mnemonics for portability)"
    - "SC126 Z180 motherboard (runs 8080/Z80; we emit 8080-only)"
  os: "CP/M 2.2 (RomWBW distribution)"
  bios: "RomWBW HBIOS (RST 1 = 0008h) — use only outside hot loops"
  assembler: "ASM.COM (Digital Research) — 8080 mnemonics"
  com_programs:
    origin: "ORG 0100H"
    return: "RET (warm boot via CCP)"
  labels_style:
    ascii: "A–Z, 0–9 only (no underscores) for maximum ASM.COM compatibility"
  strings:
    dollar_terminated: "For BDOS 9 printing — e.g., DB 'Hello','$'"
    zero_terminated: "Internal helpers only (BDOS 9 stops at '$')"
  build:
    assemble: "ASM FILENAME.ASM"
    linkload: "LOAD FILENAME"
    run: "FILENAME"

tooling:
  bdos_call:
    entry: "CALL 0005H"
    regs_in: "C=function; DE=parameter (often pointer)"
    regs_out: "A or HL (per function)"
  hbios_call:
    entry: "RST 1 (0008h)"
    regs_in: "B=function; C=unit/subfunc; HL=buffer; DE=extra"
    return_A: "0=OK; nonzero=error"
    buffers: "Some services (disk/rtcblk) want buffers in upper 32K"

hardware:
  clocks:
    SC126_Z180: "≈18.432 MHz typical (varies); don’t hardcode cycle delays"
    SC700_generic: "varies by CPU/oscillator; prefer RTC-based timing"
  memory:
    TPA: "0100H..(CCP/BDOS top) — avoid hardwired high addresses"
  sc126_led_latch:
    port: 0x0D
    desc: "User LED latch; great for heartbeat/seconds/diag"
  sc719_dio:
    typical_base:
      - 0x00   # JP1 default in many builds
      - 0x30   # sometimes configured to 30h (48)
    lines: "8-bit port; OUT drives LEDs; IN reads inputs"
    polarity:
      default: "active-high"
      invert_hint: "If visually inverted, XOR 0xFF in software"
  serial:
    devices: ["CON:", "TTY:", "UR1:", "UR2:", "AUX:", "PUN:", "RDR:", "LST:"]
    example_mode: "MODE COM1: 115200,N,8,1"

io_maps:
  probable:
    CF_registers: "0x10..0x17"
    Z80_PIO: "0x68..0x6B"
    Z80_SIO2: "0x80..0x83"
    Z80_CTC: "0x88..0x8B"
    RTC_gate: "0x0C (Z180 builds) / 0xC0 (Z80 builds) — prefer HBIOS"
  sc126_z180_onboard:
    system_latch: "0x0C"
    led_data: "0x0D"
    z180_regs: "0xC0..0xFF (ASCI/MMU/timers)"

coding_conventions:
  target_isa: "8080 strict (no Z80-only ops; no IX/IY; no ED/CB prefixed)"
  safe_ops: ["IN/OUT","RST 1","PUSH/POP","DAD BC/DE/HL/SP","XRA A","RAL/RAR","RLC/RRC"]
  avoid:
    - "Illegal DCX/INX forms (e.g., DCX DE in 8080 syntax)"
    - "EXX, DJNZ, BIT/SET/RES, LD (HL),n — Z80-only"
  asmcom_tips:
    hex: "Trailing H, leading 0 if starts with A–F (e.g., 0A0H)"
    labels: "A–Z0–9; keep short; don’t reuse local labels across modules"
  console:
    print_char: "BDOS 2 (E=char)"
    print_string: "BDOS 9 (DE->$-string)"
    console_in: "BDOS 1 (blocking; A=char)"
    nonblocking_key:
      bd06_ff: "BDOS 6 with E=0FFh → A=char or 00h (preferred)"
      bd11:    "BDOS 11 → A=FFh if key ready, else 00h (alt)"
  files_dma:
    set_dma: "BDOS 26 (DE=addr) before each read/write batch"
    fcb: "Standard CP/M FCB; r0..r2 for random I/O"

bdos_functions:
  0:  "Warm boot"
  1:  "Console input — A=char (echo)"
  2:  "Console output — E=char"
  3:  "Reader input — A=char (RDR:)"
  4:  "Punch output — E=char (PUN:)"
  5:  "List output — E=char (LST:)"
  6:  "Direct console I/O — E=FFh: peek (A=char or 00h); else output E"
  7:  "Get I/O byte — A=IOBYTE"
  8:  "Set I/O byte — E=IOBYTE"
  9:  "Print $-string — DE=addr"
  10: "Read console buffer — DE=buf; buf[0]=max; returns buf[1]=len"
  11: "Console status — A=FFh key ready else 00h"
  12: "Return version — HL=version (L=22h on CP/M 2.2)"
  13: "Reset disk system — relog/close"
  14: "Select disk — E=drive (0=A:)"
  15: "Open file — DE=FCB; A=status"
  16: "Close file — DE=FCB; A=status"
  17: "Search first — DE=FCB; A=status"
  18: "Search next — A=status"
  19: "Delete file — DE=FCB; A=status"
  20: "Read sequential — DE=FCB; A=status (00 OK, 01 EOF)"
  21: "Write sequential — DE=FCB; A=status"
  22: "Make file — DE=FCB; A=status"
  23: "Rename file — DE=FCB; A=status"
  24: "Get login vector — HL=bitmask"
  25: "Get current disk — A=drive (0=A:)"
  26: "Set DMA address — DE=addr"
  27: "Get allocation vector — HL=ALV (RO)"
  28: "Write-protect current disk"
  29: "Get read-only vector — HL=bitmask"
  30: "Set file attributes — DE=FCB; A=status"
  31: "Get DPB address — HL=DPB (RO)"
  32: "Get/Set user number — E=FFh→A=current; else set"
  33: "Read random — DE=FCB; A=status (uses r0..r2)"
  34: "Write random — DE=FCB; A=status (uses r0..r2)"
  35: "Compute file size — DE=FCB; updates r0..r2"
  36: "Set random record — DE=FCB; set r0..r2 from seq pos"
  37: "Reset drive(s) — DE=bitmask; A=err"
  40: "Write random with zero fill — DE=FCB; A=status"
  notes: "*27/31/ALV/DPB are driver-owned; treat as read-only structures."

hbios_services:
  call:
    entry: "RST 1 (0008h)"
    B: "function code"
    C: "unit/subfunc"
    HL: "buffer pointer"
    DE: "additional params"
    return_A: "0=OK; !0=error"
  CIO:  # Character I/O
    00h: "CIOIN  — C=unit → A=status, E=char"
    01h: "CIOOUT — C=unit, E=char → A=status"
    02h: "CIOIST — C=unit → A=bytes available"
    03h: "CIOOST — C=unit → A=space available"
    04h: "CIOINIT — C=unit, DE=lineword → A=status"
    05h: "CIOQUERY — C=unit → A=status, DE=lineword"
  DIO:
    10h: "STATUS"
    11h: "RESET — C=unit"
    12h: "SEEK"
    13h: "READ — C=unit, E=blocks, HL=buf"
    14h: "WRITE — C=unit, E=blocks, HL=buf"
    1Ah: "CAPACITY — returns counts/sizes to registers/buffer"
  RTC:
    20h: "RTCGETTIM — HL=6-byte BCD [YY,MM,DD,HH,MM,SS]"
    21h: "RTCSETTIM — HL=6-byte BCD"
    24h: "RTCGETBLK — HL=buffer (upper 32K preferred)"
    25h: "RTCSETBLK — HL=buffer (upper 32K preferred)"
  SYS:
    F0h: "RESET"
    F1h: "VER"
    F8h: "GET (TIMER/SECONDS/etc.)"

ansi_and_vdu:
  notes:
    - "Default to ANSI/VT100; switch to VT52 for simple VDU boards."
    - "All sequences are BDOS 9–ready (end with '$')."
  vdu_profiles:
    default: "ansi_vt100"
    options: ["ansi_vt100","vt52","plain"]
  ansi_vt100:
    basic:
      CLEAR:  "\u001B[2J$"
      HOME:   "\u001B[H$"
      RESET:  "\u001B[0m$"
      HIDE:   "\u001B[?25l$"
      SHOW:   "\u001B[?25h$"
      BELL:   "\u0007$"
    cursor_step:
      UP:     "\u001B[1A$"
      DOWN:   "\u001B[1B$"
      RIGHT:  "\u001B[1C$"
      LEFT:   "\u001B[1D$"
      NEXTLINE: "\u001B[E$"
      PREVLINE: "\u001B[F$"
      COL1:   "\u001B[1G$"
    erase:
      EL_FROM: "\u001B[0K$"
      EL_TO:   "\u001B[1K$"
      EL_ALL:  "\u001B[2K$"
      ED_FROM: "\u001B[0J$"
      ED_TO:   "\u001B[1J$"
      ED_ALL:  "\u001B[2J$"
    save_restore:
      SAVE:     "\u001B7$"
      REST:     "\u001B8$"
      SAVE_SGR: "\u001B[s$"
      REST_SGR: "\u001B[u$"
    modes:
      WRAP_ON:    "\u001B[?7h$"
      WRAP_OFF:   "\u001B[?7l$"
      INVERSE_ON: "\u001B[7m$"
      INVERSE_OFF:"\u001B[27m$"
    attributes:
      BOLD:   "\u001B[1m$"
      UNDER:  "\u001B[4m$"
      BLINK:  "\u001B[5m$"
      REV:    "\u001B[7m$"
      RESET:  "\u001B[0m$"
    colors_8:
      FG:
        BLACK:   "\u001B[30m$"
        RED:     "\u001B[31m$"
        GREEN:   "\u001B[32m$"
        YELLOW:  "\u001B[33m$"
        BLUE:    "\u001B[34m$"
        MAGENTA: "\u001B[35m$"
        CYAN:    "\u001B[36m$"
        WHITE:   "\u001B[37m$"
      FG_BRIGHT:
        BLACK:   "\u001B[90m$"
        RED:     "\u001B[91m$"
        GREEN:   "\u001B[92m$"
        YELLOW:  "\u001B[93m$"
        BLUE:    "\u001B[94m$"
        MAGENTA: "\u001B[95m$"
        CYAN:    "\u001B[96m$"
        WHITE:   "\u001B[97m$"
      BG:
        BLACK:   "\u001B[40m$"
        RED:     "\u001B[41m$"
        GREEN:   "\u001B[42m$"
        YELLOW:  "\u001B[43m$"
        BLUE:    "\u001B[44m$"
        MAGENTA: "\u001B[45m$"
        CYAN:    "\u001B[46m$"
        WHITE:   "\u001B[47m$"
      BG_BRIGHT:
        BLACK:   "\u001B[100m$"
        RED:     "\u001B[101m$"
        GREEN:   "\u001B[102m$"
        YELLOW:  "\u001B[103m$"
        BLUE:    "\u001B[104m$"
        MAGENTA: "\u001B[105m$"
        CYAN:    "\u001B[106m$"
        WHITE:   "\u001B[107m$"
    line_drawing_vt100:
      ENTER: "\u001B(0$"
      EXIT:  "\u001B(B$"
      glyphs: { HLINE: "q", VLINE: "x", UL: "l", UR: "k", LL: "m", LR: "j", TUP: "v", TDOWN: "w", TLEFT: "u", TRIGHT: "t", CROSS: "n" }
  vt52:
    basic:
      CLEAR: "\u001BE$"
      HOME:  "\u001BH$"
      RESET: "$"
    cursor_step:
      UP:    "\u001BA$"
      DOWN:  "\u001BB$"
      RIGHT: "\u001BC$"
      LEFT:  "\u001BD$"
    erase_line: "\u001BK$"
    address_note: "ESC 'Y' (row+32)(col+32) — use template vt52_cup"
  plain:
    CRLF:  "\r\n$"
    TAB8:  "\t$"
  templates:
    bdos9_print_ptr: |
      BDOS EQU 0005H
      PSTR: MVI C,9
            CALL BDOS
            RET
    vt52_cup: |
      BDOS EQU 0005H
      PCHAR:  MVI C,2
              CALL BDOS
              RET
      CUP52:  MVI A,27
              CALL PCHAR
              MVI A,'Y'
              CALL PCHAR
              MOV A,B
              ADI 32
              CALL PCHAR
              MOV A,C
              ADI 32
              CALL PCHAR
              RET
    ansi_cup_rowcol: |
      BDOS EQU 0005H
      CSI:  DB 27,'[','$'
      SEMI: DB ';','$'
      HCHR: DB 'H','$'
      PSTR: MVI C,9
            CALL BDOS
            RET
      P2D:  ; print 1..99 in B
            MOV A,B
            CPI 10
            JC  P1D
            MVI E,0
      D10:  CPI 10
            JC  D10D
            SUI 10
            INR E
            JMP D10
      D10D: ADI '0'
            MVI C,2
            MOV L,A
            MOV A,E
            ADI '0'
            MOV E,A
            CALL BDOS
            MOV A,L
            MVI C,2
            MOV E,A
            CALL BDOS
            RET
      P1D:  ADI '0'
            MVI C,2
            MOV E,A
            CALL BDOS
            RET
      CUP:  LXI D,CSI
            CALL PSTR
            CALL P2D          ; B=row
            LXI D,SEMI
            CALL PSTR
            MOV B,C
            CALL P2D          ; B=col
            LXI D,HCHR
            CALL PSTR
            RET

screen_layout:
  # Minimal UI framework: status bar + log window + prompt line
  model:
    rows: 24
    cols: 80
    status_row: 1
    log_start: 2
    log_end: 23
    prompt_row: 24
  colors:
    status: ["\u001B[7m$","\u001B[0m$"]  # reverse on/off
  templates:
    init_fullscreen_ansi: |
      BDOS EQU 0005H
      PSTR: MVI C,9
            CALL BDOS
            RET
      CLEAR: DB 27,'[2J','$'
      HOME:  DB 27,'[H','$'
      INIT:  LXI D,CLEAR
             CALL PSTR
             LXI D,HOME
             CALL PSTR
             RET
    draw_status_ansi: |
      ; In: DE->$ title; draws on row 1, clears line, reverse video
      BDOS EQU 0005H
      PSTR: MVI C,9
            CALL BDOS
            RET
      CSI:  DB 27,'[','$'
      EL:   DB 27,'[2K','$'
      REV:  DB 27,'[7m','$'
      NOR:  DB 27,'[0m','$'
      H:    DB 'H','$'
      STAT: LXI D,CSI
            CALL PSTR
            LXI D,H
            CALL PSTR
            LXI D,EL
            CALL PSTR
            LXI D,REV
            CALL PSTR
            XCHG           ; title now in HL? (adjust as needed)
            ; Assume DE already points to title:
            XCHG
            CALL PSTR
            LXI D,NOR
            CALL PSTR
            RET
    draw_prompt_ansi: |
      ; Move to last row col1, clear line and print prompt (DE)
      BDOS EQU 0005H
      PSTR: MVI C,9
            CALL BDOS
            RET
      CSI:  DB 27,'[','$'
      GOTO_LAST: DB 27,'[24;1H','$'
      EL:   DB 27,'[2K','$'
      PROMPT: LXI D,GOTO_LAST
              CALL PSTR
              LXI D,EL
              CALL PSTR
              ; DE already -> prompt
              CALL PSTR
              RET

templates:
  skeleton_com_asm: |
    ORG 0100H
    START:
        ; your code here
        RET
    END START

  pchar: |
    BDOS EQU 0005H
    PCHAR: MVI C,2
           CALL BDOS
           RET

  keycheck_nonblock: |
    BDOS EQU 0005H
    KEYCHK: MVI C,6
            MVI E,0FFH
            CALL BDOS
            RET

  # ---- Timing / RTC ----
  rtc_read_bcd: |
    ; TIMBUF(6): YY,MM,DD,HH,MM,SS (BCD)
    TIMBUF: DS 6
    READRTC:
        LXI H,TIMBUF
        MVI B,020H
        RST 1
        RET
  bcd2bin: |
    BCD2BIN:
        MOV D,A
        ANI 0FH
        MOV E,A
        MOV A,D
        ANI 0F0H
        RRC
        RRC
        RRC
        RRC
        MOV B,A
        MOV A,B
        ADD A
        MOV C,A
        MOV A,B
        ADD A
        ADD A
        ADD A
        ADD C
        ADD E
        RET
  time_delta_hms_to_u32s: |
    ; Inputs: STH,STM,STS and ENH,ENM,ENS (binary 0..59/23)
    ; Output: NW3..NW0 = total seconds (u32)
    STH: DB 0 ; start H
    STM: DB 0 ; start M
    STS: DB 0 ; start S
    ENH: DB 0 ; end H
    ENM: DB 0 ; end M
    ENS: DB 0 ; end S
    NW0: DB 0
    NW1: DB 0
    NW2: DB 0
    NW3: DB 0
    ; NW += (EN-START) normalized borrow across S/M/H
    TIMEDEL:
        ; seconds
        LDA ENS
        MOV B,A
        LDA STS
        CMP B
        JC  TD_SOK
        ; borrow from minutes
        LDA ENM
        DCR A
        STA ENM
        MVI A,60
        ADD B
        MOV B,A
    TD_SOK:  LDA STS
        SUB B
        ; A = delta S (we want positive; swap order)
        MOV B,A       ; B = Sdelta (signed)
        ; minutes
        LDA ENM
        MOV C,A
        LDA STM
        CMP C
        JC  TD_MOK
        LDA ENH
        DCR A
        STA ENH
        MVI A,60
        ADD C
        MOV C,A
    TD_MOK:  LDA STM
        SUB C
        ; A = delta M
        MOV D,A       ; D = Mdelta
        ; hours (assume <24h; no wrap across days)
        LDA ENH
        MOV E,A
        LDA STH
        SUB E
        MOV E,A       ; E = Hdelta
        ; NW = E*3600 + D*60 + B
        ; NW = 0
        XRA A
        STA NW0
        STA NW1
        STA NW2
        STA NW3
        ; add hours*3600 = hours* (60*60)
        ; H * 3600 = H* (4096-496) approx — omit for now to keep simple:
        ; For runs << 1h you can skip; else call U32_ADD_CONST multiple times.
        ; Add minutes*60
        ; Add seconds
        ; (Provide a simpler BU number instead in benchmarks; prefer RTC seconds when needed.)
        RET

  # ---- Numeric print / parse ----
  print_u32_bdos9: |
    ; NW3..NW0 -> decimal via BDOS 9
    BDOS EQU 0005H
    OUTBUF: DS 16
    OUTEND EQU OUTBUF+15
    OUTPTR: DW 0
    PTR32:  DW 0
    U32_PRINT:
        LHLD PTR32
        MOV A,M
        STA NW0
        INX H
        MOV A,M
        STA NW1
        INX H
        MOV A,M
        STA NW2
        INX H
        MOV A,M
        STA NW3
        ; zero check
        LDA NW3
        MOV B,A
        LDA NW2
        ORA B
        MOV B,A
        LDA NW1
        ORA B
        MOV B,A
        LDA NW0
        ORA B
        MOV A,B
        JNZ UP_CONT
        MVI A,'0'
        STA OUTBUF
        MVI A,'$'
        STA OUTBUF+1
        LXI D,OUTBUF
        MVI C,9
        CALL BDOS
        RET
    UP_CONT:
        LXI H,OUTEND
        SHLD OUTPTR
        MVI A,'$'
        STA OUTEND
    UP_LOOP:
        CALL DIV32_10
        LHLD OUTPTR
        DCX H
        MOV A,B
        ADI '0'
        MOV M,A
        SHLD OUTPTR
        ; loop while NW != 0
        LDA NW3
        MOV B,A
        LDA NW2
        ORA B
        MOV B,A
        LDA NW1
        ORA B
        MOV B,A
        LDA NW0
        ORA B
        MOV A,B
        JNZ UP_LOOP
        LHLD OUTPTR
        XCHG
        MVI C,9
        CALL BDOS
        RET
    DIV32_10:
        MVI B,0
        LDA NW3
        CALL DIV10_STEP
        STA NW3
        LDA NW2
        CALL DIV10_STEP
        STA NW2
        LDA NW1
        CALL DIV10_STEP
        STA NW1
        LDA NW0
        CALL DIV10_STEP
        STA NW0
        RET
    DIV10_STEP:
        MOV C,A
        MOV A,B
        MOV D,A
        XRA A
        MOV E,A
    D160:   MOV A,D
            CPI 0
            JNZ D160SUB
            MOV A,C
            CPI 0A0H
            JC  D10
    D160SUB:MOV A,C
            SUI 0A0H
            MOV C,A
            MOV A,D
            MVI B,0
            SBB B
            MOV D,A
            MOV A,E
            ADI 16
            MOV E,A
            JMP D160
    D10:    MOV A,D
            CPI 0
            JNZ D10SUB
            MOV A,C
            CPI 10
            JC  DDONE
    D10SUB: MOV A,C
            SUI 10
            MOV C,A
            MOV A,D
            MVI B,0
            SBB B
            MOV D,A
            INR E
            JMP D10
    DDONE:  MOV A,E
            MOV B,C
            RET

  print_u16_hex: |
    ; HL -> print as 4 hex digits via BDOS 2
    BDOS EQU 0005H
    HEXNIB:
        ANI 0FH
        CPI 10
        JC HN0
        ADI 7
    HN0:    ADI '0'
        MVI C,2
        MOV E,A
        CALL BDOS
        RET
    PHEX16:
        MOV A,H
        RRC
        RRC
        RRC
        RRC
        CALL HEXNIB
        MOV A,H
        CALL HEXNIB
        MOV A,L
        RRC
        RRC
        RRC
        RRC
        CALL HEXNIB
        MOV A,L
        CALL HEXNIB
        RET

  # ---- Files / directory ----
  dir_list_demo: |
    ; Lists directory entries matching FCB (wildcards ok)
    BDOS EQU 0005H
    DMA  EQU DMABUF
    START:
        LXI D,DMABUF
        MVI C,26
        CALL BDOS
        LXI D,FCB
        MVI C,17
        CALL BDOS
    DLOOP:  MVI C,18
        CALL BDOS
        ORA A
        JNZ DONE
        ; record now in DMABUF (32 bytes) — print name/typ
        ; (left as exercise: walk buffer, output via BDOS 2)
        JMP DLOOP
    DONE:   RET
    FCB:    DB 0,'*','*','*','*','*','*','*','*',' ',' ',' '
            DB '   '   ; type wildcards too if needed
            DS 20
    DMABUF: DS 128

  # ---- Hexdump / checksum ----
  hexdump_128: |
    ; Dump 128 bytes at HL as 16 lines of 8 bytes hex
    ; Trashes: A,B,C,D,E,H,L
    ; Uses BDOS 2 (PCHAR) internally
    BDOS EQU 0005H
    PCHAR: MVI C,2
           CALL BDOS
           RET
    DMP128:
        MVI D,16
    DLN:   MVI E,8
    DBY:   MOV A,M
           RRC
           RRC
           RRC
           RRC
           CALL HX
           MOV A,M
           CALL HX
           INX H
           DCR E
           JNZ DBY
           MVI A,13
           CALL PCHAR
           MVI A,10
           CALL PCHAR
           DCR D
           JNZ DLN
           RET
    HX:    ANI 0FH
           CPI 10
           JC H0
           ADI 7
    H0:    ADI '0'
           CALL PCHAR
           RET

  # ---- SC719 strobe handshake (D7 strobe, D0..D6 data) ----
  sc719_strobe_txrx: |
    DIOPORT EQU 030H
    ININV   EQU 000H
    OUTINV  EQU 000H
    PREV:   DB 00H
    ; RX: A <- byte (0..127) on rising edge; A=FFh if none
    RXBYTE: IN  DIOPORT
            XRI ININV
            MOV D,A
            ANI 080H
            MOV E,A
            LDA PREV
            ORA A
            JNZ RB_HI
            MOV A,E
            ORA A
            JZ  RB_NONE
            MOV A,D
            ANI 07FH
            MVI D,080H
            STA PREV
            RET
    RB_HI:  MOV A,E
            ORA A
            JZ  RB_SET0
            MVI A,080H
            STA PREV
            JMP RB_NONE
    RB_SET0:XRA A
            STA PREV
    RB_NONE:MVI A,0FFH
            RET
    ; TX: send A (low 7 bits) + strobe on D7
    TXBYTE: ANI 07FH
            MOV B,A
            MOV A,B
            XRI OUTINV
            OUT DIOPORT
            MVI C,02H
    TX1:    DCR C
            JNZ TX1
            MOV A,B
            ORI 080H
            XRI OUTINV
            OUT DIOPORT
            MVI C,08H
    TX2:    DCR C
            JNZ TX2
            MOV A,B
            XRI OUTINV
            OUT DIOPORT
            MVI C,02H
    TX3:    DCR C
            JNZ TX3
            RET

checklist_before_run:
  - "Confirm SC719 base I/O (JP1). If LEDs look inverted, XOR 0xFF."
  - "On SC126, quick OUT 0Dh smoke test before fancy code."
  - "Use BDOS 9 with '$'-terminated strings. No '$' → spew."
  - "Keep HBIOS out of hot loops. If vectors differ, stub out until verified."
  - "Calibrate any busy-wait delays on *your* oscillator."

known_quirks_and_tips:
  - "BDOS 6 E=0FFh is the safest non-blocking keystroke on CP/M 2.2."
  - "ASM.COM dislikes odd label chars; keep labels simple."
  - "For benchmarks, prefer pure-CPU loops; take timestamps only outside."

