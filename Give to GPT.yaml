# SC700/SC126 + RomWBW 8080 Assembly Profile
# Version: 1.1
# Last-Updated: 2025-09-03
# Purpose: Hand this file back to ChatGPT later — it encodes everything needed
#          to generate *correct 8080 code* for your SC700-series & SC126 rigs
#          (RomWBW CP/M 2.2; ASM.COM 8080 mnemonics; strict 8080 only)

meta:
  systems:
    - "SC700 series (RCBus family; Z80-class; target 8080 mnemonics for portability)"
    - "SC126 Z180 motherboard (runs 8080/Z80 code; we emit 8080-only)"
  os: "CP/M 2.2 (RomWBW distribution)"
  bios: "RomWBW HBIOS (proxy at RST 1 = 0008h)"
  assembler: "ASM.COM (Digital Research) — 8080 mnemonics only"
  com_programs:
    origin: "ORG 0100H"
    return: "RET (warm boot via CCP; no implicit exit call)"
  label_style:
    asmcom_gotcha: "Avoid underscores in labels (some ASM.COM configs misread them); use A-Z0-9 only."
  strings:
    dollar_terminated: "For BDOS 9 (print): DB 'Hello','$'"
    zero_terminated: "For internal helper loops only (not BDOS 9)"
  build:
    assemble: "ASM FILENAME.ASM"
    linkload: "LOAD FILENAME"
    run: "FILENAME"

tooling:
  bdos_call:
    entry: "CALL 0005H"
    regs_in: "C=function, DE=param (address or value) when applicable"
    regs_out: "A or HL depending on function (classic CP/M 2.2 rules)"
  hbios_call:
    entry: "RST 1 (0008h)"
    regs_in: "B=function, C=sub/Unit (often), HL=buffer, DE=extra args as needed"
    status: "A=0 success; nonzero = error"
    note: "Some services require buffers in the upper 32K; see RomWBW docs."

hardware:
  clocks:
    SC126_Z180: "typ ~18.432 MHz (some builds double via Z180; treat delays as approximate)"
    SC700_generic: "varies; do not hardcode cycle counts unless calibrated locally"
  memory:
    TPA: "0100H up to CCP/BDOS; avoid fixed high addresses unless you own them"
  sc126_led_latch:
    port: 0x0D
    desc: "SC126 user LEDs via system latch (seconds/diagnostics mirror)"
  sc719_dio:
    typical_base:
      - 0x00    # many SCC docs default JP1 open = 00h
      - 0x30    # some builds select 30h (48) — verify JP1
    lines: "D0..D7 on a single port; OUT writes LEDs, IN reads inputs"
    polarity:
      default: "active-high"
      invert_hint: "If LEDs look inverted, XOR 0xFF in software"

io_maps:
  probable:
    CF_registers: "0x10..0x17"
    Z80_PIO: "0x68..0x6B"
    Z80_SIO2: "0x80..0x83"
    Z80_CTC: "0x88..0x8B"
    RTC_gate: "0x0C (Z180 builds) / 0xC0 (Z80 builds) — but normally use HBIOS"
  sc126_z180_onboard:
    system_latch: "0x0C"
    led_data: "0x0D"
    z180_regs: "0xC0..0xFF (ASCI/MMU/timers)"

coding_conventions:
  target_isa: "8080 strict (no Z80-only ops, no IX/IY, no ED/CB prefixed)"
  safe_ops: ["IN/OUT", "RST 1", "PUSH/POP", "DAD (BC/DE/HL/SP only)", "XRA A", "RAL/RAR", "RLC/RRC"]
  avoid:
    - "DCX/INX on illegal pseudo-regs (e.g., DCX DE is illegal in 8080 syntax)"
    - "EXX, DJNZ, BIT/SET/RES, LD (HL),n — Z80-only"
  asmcom_tips:
    hex_constants: "Use trailing H and leading 0 when A..F (e.g., 0A0H)"
    labels: "Prefer A-Z0-9, no underscores to dodge rare parser quirks"
  console:
    print_char: "BDOS 2 (E=char)"
    print_string: "BDOS 9 (DE->$ string)"
    console_in: "BDOS 1 (blocking; returns A=char)"
    nonblocking_key: "BDOS 6 with E=0FFh → A=char or 00h"
  files_dma:
    set_dma: "BDOS 26 (DE=buffer) before sequential/random read/write"
    fcb: "Standard CP/M FCB layout; r0..r2 used for random I/O"

bdos_functions:  # CP/M 2.2 complete set your rig uses
  0:  "System reset (warm boot) — no params"
  1:  "Console input — returns A=char (echoed)"
  2:  "Console output — E=char"
  3:  "Reader input — A=char (RDR:)"
  4:  "Punch output — E=char (PUN:)"
  5:  "List output — E=char (LST:)"
  6:  "Direct console I/O — E=FFh: peek (A=char or 00h); else E=char outputs"
  7:  "Get I/O byte — A=IOBYTE"
  8:  "Set I/O byte — E=IOBYTE"
  9:  "Print $-terminated string — DE=addr"
  10: "Read console buffer — DE=buf; buf[0]=max → buf[1]=len, text at buf+2"
  11: "Console status — A=FFh if key ready, else 00h"
  12: "Return version — HL=version (L=22h on CP/M 2.2)"
  13: "Reset disk system — relog/close"
  14: "Select disk — E=drive (0=A:)"
  15: "Open file — DE=FCB; A=dir code/status"
  16: "Close file — DE=FCB; A=dir code/status"
  17: "Search first — DE=FCB; A=dir code/status"
  18: "Search next — A=dir code/status"
  19: "Delete file — DE=FCB; A=dir code/status"
  20: "Read sequential — DE=FCB; A=status"
  21: "Write sequential — DE=FCB; A=status"
  22: "Make file — DE=FCB; A=dir code/status"
  23: "Rename file — DE=FCB; A=dir code/status"
  24: "Get login vector — HL=drive bitmask"
  25: "Get current disk — A=drive (0=A:)"
  26: "Set DMA address — DE=addr"
  27: "Get allocation vector — HL=ALV* (current drive)"
  28: "Write-protect current disk — no params"
  29: "Get read-only vector — HL=bitmask"
  30: "Set file attributes — DE=FCB; A=dir code/status"
  31: "Get DPB address — HL=DPB* (current drive)"
  32: "Get/Set user number — E=FFh→A=current; else E=0..15 to set"
  33: "Read random — DE=FCB; A=status (uses r0..r2)"
  34: "Write random — DE=FCB; A=status (uses r0..r2)"
  35: "Compute file size — DE=FCB; updates r0..r2"
  36: "Set random record — DE=FCB; set r0..r2 from sequential pos"
  37: "Reset drive(s) — DE=bitmask; A=err"
  40: "Write random with zero fill — DE=FCB; A=status"
  notes: "*27/31 return driver-owned structures; treat as read-only."

hbios_services:  # RomWBW high-level, enough for coding
  call:
    entry: "RST 1 (0008h)"
    B: "function code"
    C: "unit/subfunction (e.g., 0x80 = current console)"
    HL: "buffer pointer (when required)"
    DE: "extra params as defined by service"
    return_A: "0 = success; !0 = error"
  CIO:  # Character I/O
    00h: "CIOIN  — C=unit → A=status, E=char (blocking)"
    01h: "CIOOUT — C=unit, E=char → A=status"
    02h: "CIOIST — C=unit → A=bytes available"
    03h: "CIOOST — C=unit → A=space available"
    04h: "CIOINIT — C=unit, DE=lineword → A=status"
    05h: "CIOQUERY — C=unit → A=status, DE=lineword"
  DIO:  # Disk I/O (buffers in upper 32K)
    10h: "STATUS"
    11h: "RESET — C=unit"
    12h: "SEEK — CHS or LBA depending on driver"
    13h: "READ — C=unit, E=blocks, HL=buffer"
    14h: "WRITE — C=unit, E=blocks, HL=buffer"
    1Ah: "CAPACITY — C=unit, HL=buf → DE:HL=blocks, BC=blk size"
  RTC:
    20h: "RTCGETTIM — HL=6-byte BCD buf [YY,MM,DD,HH,MM,SS]"
    21h: "RTCSETTIM — HL=6-byte BCD buf"
    24h: "RTCGETBLK — HL=buffer (upper 32K)"
    25h: "RTCSETBLK — HL=buffer (upper 32K)"
  SYS:
    F0h: "RESET"
    F1h: "VER — version into registers (maj/min/build)"
    F8h: "GET — subfunctions: TIMER/SECONDS/DEVICE COUNTS/etc."

serial_and_console:
  romwbw_devices: ["CON:", "TTY:", "UR1:", "UR2:", "AUX:", "PUN:", "RDR:", "LST:"]
  mode_examples:
    - "MODE COM1: 115200,N,8,1"
  nonblocking_key:
    bdos6_ff: "E=FFh, C=6 → A=char or 00h if none"

ansi_and_vdu:
  # All strings here are BDOS 9–ready ($-terminated). Send with C=9, DE=ptr, CALL 0005h.
  notes:
    - "Most SC126/SC700 setups talk to an ANSI/VT100-ish terminal (PC serial, USB TTL, Wi-Fi serial, etc.)."
    - "Some standalone VDU boards implement VT52 or limited ANSI; use the 'vdu_profiles' map to select."
    - "If a sequence isn’t supported, the terminal will ignore it—provide graceful fallbacks."

  ansi_vt100:
    esc: "\u001B"    # ESC
    csi: "\u001B["
    basic:
      CLEAR:  "\u001B[2J$"          # clear screen
      HOME:   "\u001B[H$"           # cursor to 1,1
      RESET:  "\u001B[0m$"          # SGR reset
      HIDE:   "\u001B[?25l$"        # hide cursor
      SHOW:   "\u001B[?25h$"        # show cursor
      BELL:   "\u0007$"             # beep (if supported)
    cursor_step:
      UP:     "\u001B[1A$"
      DOWN:   "\u001B[1B$"
      RIGHT:  "\u001B[1C$"
      LEFT:   "\u001B[1D$"
      NEXTLINE: "\u001B[E$"
      PREVLINE: "\u001B[F$"
      COL1:   "\u001B[1G$"          # move to column 1 (stay on row)
    erase:
      EL_FROM: "\u001B[0K$"         # erase to end of line
      EL_TO:   "\u001B[1K$"         # erase to start of line
      EL_ALL:  "\u001B[2K$"         # erase entire line
      ED_FROM: "\u001B[0J$"         # erase to end of screen
      ED_TO:   "\u001B[1J$"         # erase to top of screen
      ED_ALL:  "\u001B[2J$"         # clear entire screen (same as CLEAR)
    save_restore:
      SAVE:   "\u001B7$"            # DEC save cursor
      REST:   "\u001B8$"            # DEC restore cursor
      SAVE_SGR: "\u001B[s$"         # xterm save cursor (alt)
      REST_SGR: "\u001B[u$"         # xterm restore cursor (alt)
    scroll_region:
      # Set top/bottom margins; printing at bottom scrolls within region
      # (Use template 'ansi_set_scroll_region' to parameterize.)
      # Example literal for 2..23: "\u001B[2;23r$"
      RESET: "\u001B[r$"
    modes:
      WRAP_ON:  "\u001B[?7h$"
      WRAP_OFF: "\u001B[?7l$"
      INVERSE_ON:  "\u001B[7m$"
      INVERSE_OFF: "\u001B[27m$"
    attributes:
      BOLD:      "\u001B[1m$"
      DIM:       "\u001B[2m$"
      ITALIC:    "\u001B[3m$"
      UNDER:     "\u001B[4m$"
      BLINK:     "\u001B[5m$"
      REVERSE:   "\u001B[7m$"
      HIDDEN:    "\u001B[8m$"
      STRIKE:    "\u001B[9m$"
      RESET:     "\u001B[0m$"
    colors_8:
      # 8-color SGR (foreground 30–37, background 40–47)
      FG:
        BLACK:   "\u001B[30m$"
        RED:     "\u001B[31m$"
        GREEN:   "\u001B[32m$"
        YELLOW:  "\u001B[33m$"
        BLUE:    "\u001B[34m$"
        MAGENTA: "\u001B[35m$"
        CYAN:    "\u001B[36m$"
        WHITE:   "\u001B[37m$"
      FG_BRIGHT:
        BLACK:   "\u001B[90m$"
        RED:     "\u001B[91m$"
        GREEN:   "\u001B[92m$"
        YELLOW:  "\u001B[93m$"
        BLUE:    "\u001B[94m$"
        MAGENTA: "\u001B[95m$"
        CYAN:    "\u001B[96m$"
        WHITE:   "\u001B[97m$"
      BG:
        BLACK:   "\u001B[40m$"
        RED:     "\u001B[41m$"
        GREEN:   "\u001B[42m$"
        YELLOW:  "\u001B[43m$"
        BLUE:    "\u001B[44m$"
        MAGENTA: "\u001B[45m$"
        CYAN:    "\u001B[46m$"
        WHITE:   "\u001B[47m$"
      BG_BRIGHT:
        BLACK:   "\u001B[100m$"
        RED:     "\u001B[101m$"
        GREEN:   "\u001B[102m$"
        YELLOW:  "\u001B[103m$"
        BLUE:    "\u001B[104m$"
        MAGENTA: "\u001B[105m$"
        CYAN:    "\u001B[106m$"
        WHITE:   "\u001B[107m$"
    colors_256:
      # If your terminal is modern (PC serial), these work; vintage VDUs may ignore.
      # Use templates to emit: ESC '[' '38;5;' <n> 'm' for FG, '48;5;' for BG.
      FG_FMT: "\u001B[38;5;X$m"   # replace X$ at runtime (see templates)
      BG_FMT: "\u001B[48;5;X$m"
    line_drawing_vt100:
      # Enter/exit VT100 line drawing; glyphs map below.
      ENTER: "\u001B(0$"   # switch G0 to line-drawing
      EXIT:  "\u001B(B$"   # back to ASCII
      glyphs:
        HLINE: "q"  # ─
        VLINE: "x"  # │
        UL:    "l"  # ┌
        UR:    "k"  # ┐
        LL:    "m"  # └
        LR:    "j"  # ┘
        TUP:   "v"  # ┴
        TDOWN: "w"  # ┬
        TLEFT: "u"  # ┤
        TRIGHT:"t"  # ├
        CROSS: "n"  # ┼

  vt52:
    # Many simple VDU boards implement VT52 (or near-VT52) rather than full ANSI.
    basic:
      CLEAR: "\u001BE$"        # CLS
      HOME:  "\u001BH$"        # cursor home
      RESET: "$"               # (no generic reset; send nothing)
    cursor_step:
      UP:    "\u001BA$"
      DOWN:  "\u001BB$"
      RIGHT: "\u001BC$"
      LEFT:  "\u001BD$"
    address_note: "VT52 direct address is ESC 'Y' (row+32) (col+32). Use template 'vt52_cup' to print."
    erase_line: "\u001BK$"     # erase to end of line (common)
    save_restore:              # not universal on VT52; leave empty or board-specific
      SAVE: "$"
      REST: "$"

  vdu_profiles:
    # Select the profile your physical VDU understands.
    default: "ansi_vt100"
    options:
      - "ansi_vt100"
      - "vt52"
      - "plain"   # no control codes; print only text + CR/LF

  plain:
    CRLF:  "\r\n$"
    TAB8:  "\t$"

  # -----------------------
  # 8080/ASM templates
  # -----------------------
  templates:
    bdos9_print_ptr: |
      ; Print $-terminated string at DE (BDOS 9)
      BDOS EQU 0005H
      PSTR:   MVI C,9
              CALL BDOS
              RET

    ansi_cup_rowcol: |
      ; Cursor to row, col (1-based): prints ESC '[' row ';' col 'H'
      ; In:  B=row (1..99), C=col (1..99)
      ; Trashes: A,D,E,H,L
      BDOS    EQU 0005H
      CSI:    DB 27,'[','$'
      HCHR:   DB 'H','$'
      SEMI:   DB ';','$'
      PSTR:   MVI C,9
              CALL BDOS
              RET
      PNUM2:  ; print 1..99 in B as decimal (no leading zeros)
              MOV A,B
              CPI 10
              JC  PNUM1D
              ; two digits
              MVI D,10
              ; divide A by 10 -> Q in A, R in E
              MVI E,0
      D10:    CPI 10
              JC  D10D
              SUI 10
              INR E
              JMP D10
      D10D:   ADI '0'
              MOV L,A
              MOV A,E
              ADI '0'
              MOV E,A
              ; print tens (E), ones (L)
              MOV A,E
              MVI C,2
              MOV E,A
              CALL BDOS
              MOV A,L
              MVI C,2
              MOV E,A
              CALL BDOS
              RET
      PNUM1D: ADI '0'
              MVI C,2
              MOV E,A
              CALL BDOS
              RET
      CUP:    ; emit CSI, row, ';', col, 'H'
              LXI D,CSI
              CALL PSTR
              CALL PNUM2        ; row in B
              LXI D,SEMI
              CALL PSTR
              ; col now in C -> move to B for PNUM2
              MOV B,C
              CALL PNUM2
              LXI D,HCHR
              CALL PSTR
              RET

    ansi_set_scroll_region: |
      ; Set scroll region top..bot using ESC '[' top ';' bot 'r'
      ; In: B=top (1..99), C=bot (1..99)
      BDOS EQU 0005H
      CSIR: DB 27,'[','$'
      RCHR: DB 'r','$'
      SEMI: DB ';','$'
      ; reuse PSTR / PNUM2 from ansi_cup_rowcol
      ; Entry: TOPBOT:
      TOPBOT: LXI D,CSIR
              MVI C,9
              CALL BDOS
              CALL PNUM2        ; row=top (B)
              LXI D,SEMI
              MVI C,9
              CALL BDOS
              MOV B,C           ; col=bot (C) -> B
              CALL PNUM2
              LXI D,RCHR
              MVI C,9
              CALL BDOS
              RET

    vt52_cup: |
      ; VT52 cursor address: ESC 'Y' (row+32) (col+32)
      ; In: B=row (1..24), C=col (1..80)
      BDOS EQU 0005H
      PCHAR:  MVI C,2
              CALL BDOS
              RET
      CUP52:  MVI A,27
              CALL PCHAR
              MVI A,'Y'
              CALL PCHAR
              MOV A,B
              ADI 32
              CALL PCHAR
              MOV A,C
              ADI 32
              CALL PCHAR
              RET

    vt100_box_draw_demo: |
      ; Draw a 20x6 box at (row=R, col=C) using VT100 line drawing
      ; In: B=R, C=C
      BDOS EQU 0005H
      PCHAR:  MVI C,2
              CALL BDOS
              RET
      PSTR:   MVI C,9
              CALL BDOS
              RET
      ENGD:   DB 27,'(0','$'   ; line set on
      EXGD:   DB 27,'(B','$'   ; line set off
      H:      DB 'q','$'       ; ─
      V:      DB 'x','$'       ; │
      UL:     DB 'l','$'       ; ┌
      UR:     DB 'k','$'       ; ┐
      LL:     DB 'm','$'       ; └
      LR:     DB 'j','$'       ; ┘
      CSI:    DB 27,'[','$'
      SEMI:   DB ';','$'
      HCHR:   DB 'H','$'
      ; Requires CUP and PNUM2 from ansi_cup_rowcol template.
      BOX20x6:
              ; switch to drawing set
              LXI D,ENGD
              CALL PSTR
              ; corners and horizontals
              ; top-left
              ; CUP to (B,C)
              CALL CUP
              LXI D,UL
              CALL PSTR
              MVI DREG,18       ; 18 inner horizontals (total width 20)
      BH1:    LXI D,H
              CALL PSTR
              DCR DREG
              JNZ BH1
              LXI D,UR
              CALL PSTR
              ; verticals for 4 middle rows
              MVI RCT,4
      BV:     INR B             ; next row
              CALL CUP
              LXI D,V
              CALL PSTR
              ; move to right side
              MOV B,B
              ; CUP to (row=B, col=C+19)
              ; compute C+19 into C (temp)
              MVI A,19
              ADD C
              MOV C,A
              CALL CUP
              LXI D,V
              CALL PSTR
              ; restore C (subtract 19)
              MVI A,19
              CMA
              INRA: ; A=~19 not ideal; leave as note to recompute C
              DCR RCT
              JNZ BV
              ; bottom row
              INR B
              CALL CUP
              LXI D,LL
              CALL PSTR
              MVI DREG,18
      BH2:    LXI D,H
              CALL PSTR
              DCR DREG
              JNZ BH2
              LXI D,LR
              CALL PSTR
              ; back to ASCII
              LXI D,EXGD
              CALL PSTR
              RET
      ; NOTE: In real code, manage C math more cleanly (keep temp col in a register pair).

  diagnostics:
    probe_ansi: |
      ; Quick probe: clear, home, draw colored headline, restore
      BDOS EQU 0005H
      PSTR:   MVI C,9
              CALL BDOS
              RET
      CLR:    DB 27,'[2J','$'
      HOME:   DB 27,'[H','$'
      GREEN:  DB 27,'[1;32m','$'
      RESET:  DB 27,'[0m','$'
      MSG:    DB 'ANSI/VT100 OK','$'
      PROBE:  LXI D,CLR
              CALL PSTR
              LXI D,HOME
              CALL PSTR
              LXI D,GREEN
              CALL PSTR
              LXI D,MSG
              CALL PSTR
              LXI D,RESET
              CALL PSTR
              RET

  usage_examples:
    clear_and_title_ansi: |
      ; Clear screen, home, print title centered at row 1
      ; (Compute col externally or just print at col 1)
      BDOS EQU 0005H
      PSTR:   MVI C,9
              CALL BDOS
              RET
      CLEAR:  DB 27,'[2J','$'
      HOME:   DB 27,'[H','$'
      TITLE:  DB 'SC700/SC126 — Ready','$'
      START:  LXI D,CLEAR
              CALL PSTR
              LXI D,HOME
              CALL PSTR
              LXI D,TITLE
              CALL PSTR
              RET

  gotchas:
    - "Always end BDOS-9 strings with '$'."
    - "Some VDUs ignore SGR (colors/attrs). Structure UI so it still reads without color."
    - "VT52 addressing uses row+32/col+32 bytes; don’t send ASCII digits."
    - "If your VDU scrolls slowly, write full lines then move the cursor; avoid per-char cursor moves."


templates:
  skeleton_com_asm: |
    ; ---------- CP/M .COM skeleton (8080) ----------
    ORG 0100H
    START:
        ; your code here
        RET
    END START

  print_line_bdos9: |
    ; Print $-string at DX/DE
    BDOS EQU 0005H
    ORG 0100H
    LXI D,MSG
    MVI C,9
    CALL BDOS
    RET
    MSG: DB 'Hello from 8080!','$'
    END

  pchar_macro_free: |
    ; PCHAR: print char in E via BDOS 2
    BDOS EQU 0005H
    PCHAR:  MVI C,2
            CALL BDOS
            RET

  nonblocking_keycheck: |
    ; KEYCHECK: A=0 if none; else A=char
    BDOS EQU 0005H
    KEYCHECK:
        MVI C,6
        MVI E,0FFH
        CALL BDOS
        RET

  hbios_rtc_read: |
    ; READRTC: fills TIMBUF (BCD YY,MM,DD,HH,MM,SS)
    TIMBUF: DS 6
    READRTC:
        LXI H,TIMBUF
        MVI B,020H
        RST 1
        RET

  sc126_led_seconds: |
    ; Mirror seconds to SC126 LED latch (port 0Dh)
    LEDP   EQU 00DH
    INVERT EQU 00H      ; use FFh if LEDs are active-low
    ; A on entry = seconds (0..59) binary
    XRI INVERT
    OUT LEDP
    RET

  sc719_raw_mirror: |
    ; RAW MIRROR (all 8 bits) on SC719 at base port (e.g., 00h or 30h)
    DIOPORT EQU 030H
    ORG 0100H
    START: IN  DIOPORT
           OUT DIOPORT
           JMP START
    END START

  time_line_hhmmss: |
    ; Print "HH:MM:SS" from TIMBUF (BCD)
    BDOS EQU 0005H
    CONOUT EQU 2
    PCHAR: MVI C,CONOUT
           CALL BDOS
           RET
    P2DIG: MOV D,A
           ANI 0FH
           ADI '0'
           MOV L,A
           MOV A,D
           ANI 0F0H
           RRC
           RRC
           RRC
           RRC
           ADI '0'
           MOV H,A
           MOV A,H
           CALL PCHAR
           MOV A,L
           CALL PCHAR
           RET
    ; Usage: LDA TIMBUF+3 / CALL P2DIG / ':' / etc.

checklist_before_run:
  - "Verify SC719 JP1 (I/O base). If LEDs look inverted, XOR 0xFF."
  - "On SC126, LED latch at 0x0D: quick OUT test before fancy code."
  - "When using HBIOS disk/NVRAM, keep buffers in the upper 32K."
  - "For BDOS 9 strings, don’t forget trailing '$'."
  - "For ASM.COM 8080: avoid Z80-only mnemonics and illegal DCX/INX forms."
  - "Calibrate any busy-wait delays per your actual clock."

known_quirks_and_tips:
  - "Some RomWBW builds differ in how RST 1 is vectored; if HBIOS calls fault, stub them out and test pure BDOS first."
  - "BDOS 6 (E=FFh) is the most reliable non-blocking key check on CP/M 2.2."
  - "Use ORG 0100H and keep stack usage modest unless you set SP explicitly."
  - "Prefer deterministic inner loops for benchmarks; collect time with RTC only outside the hot path."

